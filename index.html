<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPORTZONE - Tienda Deportiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen flex flex-col justify-between" style="background-image: url('https://www.shutterstock.com/image-illustration/soccer-ball-basket-3d-illustration-260nw-1898407648.jpg');">

    <div class="absolute inset-0 bg-black/50 z-0"></div>

    <div id="app" class="relative z-10 flex-grow flex items-center justify-center p-4"></div>

    <footer class="relative z-10 text-center text-white text-sm py-4 bg-black/40">
        SPORTZONE © 2026 - Sistema de Gestión y Tienda Deportiva
    </footer>

    <script>
        // ==========================================
        // PARTE 1: ESTADOS, DATOS Y VISTA INICIAL
        // ==========================================
        let productos = [
            { codigo: "F001", nombre: "Balón Adidas Pro", deporte: "Fútbol", categoria: "Balones", precio: 350.00, stock: 10, imagen: "https://images.unsplash.com/photo-1614632537190-23e4146777db?w=300" },
            { codigo: "F002", nombre: "Guantes de Portero", deporte: "Fútbol", categoria: "Porteros", precio: 275.00, stock: 6, imagen: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=300" },
            { codigo: "F003", nombre: "Tacos Nike Phantom", deporte: "Fútbol", categoria: "Calzado", precio: 850.00, stock: 5, imagen: "https://images.unsplash.com/photo-1511886929837-354d827aae26?w=300" },
            { codigo: "B001", nombre: "Balón Spalding NBA", deporte: "Básquetbol", categoria: "Balones", precio: 400.00, stock: 8, imagen: "https://images.unsplash.com/photo-1519861531473-9200262188bf?w=300" },
            { codigo: "B002", nombre: "Camiseta Deportiva", deporte: "Básquetbol", categoria: "Ropa", precio: 300.00, stock: 12, imagen: "https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=300" },
            { codigo: "B003", nombre: "Tenis Básquetbol Nike", deporte: "Básquetbol", categoria: "Calzado", precio: 750.00, stock: 7, imagen: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" }
        ];

        let ventas = [];
        let carrito = [];

        function mostrarInicio() {
            document.getElementById('app').innerHTML = `
                <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center">
                    <h1 class="text-3xl font-black text-slate-800 mb-2">⚽ SPORTZONE 🏀</h1>
                    <p class="text-slate-600 mb-6">Selecciona tu modo de acceso:</p>
                    <button onclick="mostrarTiendaCliente()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 mb-4">
                        🛍️ Ingresar como Cliente
                    </button>
                    <button onclick="mostrarLoginAdmin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                        🔑 Acceso Administrador
                    </button>
                </div>
            `;
        }

        function mostrarLoginAdmin() {
            document.getElementById('app').innerHTML = `
                <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full">
                    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">🔑 Panel de Administración</h2>
                    <label class="block text-slate-700 font-semibold mb-2">Usuario:</label>
                    <input type="text" id="adminUser" value="admin" class="w-full p-3 border rounded-xl mb-4 focus:ring-2 focus:ring-slate-800 outline-none">
                    <label class="block text-slate-700 font-semibold mb-2">Contraseña:</label>
                    <input type="password" id="adminPass" value="1234" class="w-full p-3 border rounded-xl mb-6 focus:ring-2 focus:ring-slate-800 outline-none">
                    <button onclick="validarAdmin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl shadow-lg mb-3">INGRESAR</button>
                    <button onclick="mostrarInicio()" class="w-full bg-gray-300 hover:bg-gray-400 text-slate-800 font-bold py-2 rounded-xl">Volver</button>
                </div>
            `;
        }

        function validarAdmin() {
            let u = document.getElementById('adminUser').value;
            let p = document.getElementById('adminPass').value;
            if (u === "admin" && p === "1234") { mostrarMenuAdmin(); } 
            else { alert("Usuario o contraseña incorrectos."); }
        }
// ==========================================
        // PARTE 2: LÓGICA DE CLIENTE Y CARRITO
        // ==========================================
        function mostrarTiendaCliente(filtro = 'Todos') {
            let productosFiltrados = filtro === 'Todos' ? productos : productos.filter(p => p.deporte === filtro);
            let totalItemsCarrito = carrito.reduce((sum, item) => sum + item.cantidad, 0);

            let html = `
                <div class="bg-white/95 backdrop-blur-md w-full max-w-6xl p-6 rounded-2xl shadow-2xl flex flex-col h-[85vh]">
                    <div class="flex justify-between items-center pb-4 border-b mb-4">
                        <h2 class="text-2xl font-black text-slate-800">🛒 Catálogo de Productos</h2>
                        <div class="flex gap-3">
                            <button onclick="mostrarCarrito()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl font-bold shadow">🛍️ Carrito (${totalItemsCarrito})</button>
                            <button onclick="mostrarInicio()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-xl font-bold shadow">Salir</button>
                        </div>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <button onclick="mostrarTiendaCliente('Todos')" class="px-4 py-2 rounded-lg font-semibold ${filtro==='Todos'?'bg-slate-800 text-white':'bg-gray-200 text-slate-700'}">Todos</button>
                        <button onclick="mostrarTiendaCliente('Fútbol')" class="px-4 py-2 rounded-lg font-semibold ${filtro==='Fútbol'?'bg-slate-800 text-white':'bg-gray-200 text-slate-700'}">⚽ Fútbol</button>
                        <button onclick="mostrarTiendaCliente('Básquetbol')" class="px-4 py-2 rounded-lg font-semibold ${filtro==='Básquetbol'?'bg-slate-800 text-white':'bg-gray-200 text-slate-700'}">🏀 Básquetbol</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 overflow-y-auto p-2 flex-grow">
            `;

            productosFiltrados.forEach(p => {
                html += `
                    <div class="bg-white border rounded-2xl p-4 shadow hover:shadow-lg transition flex flex-col justify-between relative">
                        <span class="absolute top-2 right-2 bg-red-500 text-white text-xs px-2 py-1 font-bold rounded-full">OFERTA</span>
                        <img src="${p.imagen}" alt="${p.nombre}" class="w-full h-40 object-cover rounded-xl mb-3">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800">${p.nombre}</h3>
                            <p class="text-xs text-slate-500 mb-2">${p.deporte} • ${p.categoria}</p>
                            <p class="text-xl font-black text-teal-600">Q${p.precio.toFixed(2)}</p>
                            <p class="text-xs text-slate-600 mb-4">Disponibles: ${p.stock}</p>
                        </div>
                        <button onclick="agregarAlCarrito('${p.codigo}')" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 rounded-xl shadow">🛒 Añadir al carrito</button>
                    </div>
                `;
            });

            html += `</div></div>`;
            document.getElementById('app').innerHTML = html;
        }

        function agregarAlCarrito(codigo) {
            let prod = productos.find(p => p.codigo === codigo);
            let enCarrito = carrito.find(item => item.producto.codigo === codigo);
            let cantidadActual = enCarrito ? enCarrito.cantidad : 0;
            if (cantidadActual + 1 > prod.stock) { alert("No hay suficiente stock disponible."); return; }
            if (enCarrito) { enCarrito.cantidad++; } else { carrito.push({ producto: prod, cantidad: 1 }); }
            alert(`¡${prod.nombre} agregado al carrito!`);
            mostrarTiendaCliente();
        }

        function mostrarCarrito() {
            let total = carrito.reduce((sum, item) => sum + (item.producto.precio * item.cantidad), 0);
            let html = `<div class="bg-white/95 backdrop-blur-md w-full max-w-3xl p-6 rounded-2xl shadow-2xl flex flex-col"><h2 class="text-2xl font-black text-slate-800 mb-4">🛍️ Tu Carrito de Compras</h2>`;
            if (carrito.length === 0) {
                html += `<p class="text-slate-500 my-8 text-center">El carrito está vacío.</p>`;
            } else {
                html += `<div class="space-y-4 max-h-60 overflow-y-auto mb-4">`;
                carrito.forEach((item, index) => {
                    html += `<div class="flex justify-between items-center border-b pb-2"><div><h4 class="font-bold text-slate-800">${item.producto.nombre}</h4><p class="text-sm text-slate-500">Q${item.producto.precio.toFixed(2)} x ${item.cantidad}</p></div><div class="flex items-center gap-4"><span class="font-bold text-teal-600">Q${(item.producto.precio * item.cantidad).toFixed(2)}</span><button onclick="quitarDelCarrito(${index})" class="text-red-500 font-bold hover:underline">Eliminar</button></div></div>`;
                });
                html += `</div><div class="text-xl font-black text-right mb-6 text-slate-800">Total: Q${total.toFixed(2)}</div><button onclick="finalizarCompra()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl shadow mb-2">✅ Finalizar Compra</button>`;
            }
            html += `<button onclick="mostrarTiendaCliente()" class="w-full bg-gray-300 hover:bg-gray-400 text-slate-800 font-bold py-2 rounded-xl">Seguir Comprando</button></div>`;
            document.getElementById('app').innerHTML = html;
        }

        function quitarDelCarrito(index) { carrito.splice(index, 1); mostrarCarrito(); }

        function finalizarCompra() {
            carrito.forEach(item => {
                item.producto.stock -= item.cantidad;
                ventas.push({ codigo: item.producto.codigo, nombre: item.producto.nombre, cantidad: item.cantidad, total: item.producto.precio * item.cantidad });
            });
            carrito = [];
            alert("¡Compra realizada con éxito! Registrada en el sistema.");
            mostrarTiendaCliente();
        }
// ==========================================
        // PARTE 3: PANEL ADMINISTRADOR Y ESTADÍSTICAS
        // ==========================================
        function mostrarMenuAdmin() {
            document.getElementById('app').innerHTML = `
                <div class="bg-white/95 backdrop-blur-md w-full max-w-4xl p-6 rounded-2xl shadow-2xl">
                    <div class="flex justify-between items-center pb-4 border-b mb-6">
                        <h2 class="text-2xl font-black text-slate-800">⚙️ Panel de Administrador</h2>
                        <button onclick="mostrarInicio()" class="bg-rose-500 text-white px-4 py-2 rounded-xl font-bold shadow">Cerrar Sesión</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button onclick="verInventarioAdmin()" class="bg-slate-800 hover:bg-slate-900 text-white p-4 rounded-xl font-bold shadow">📦 Ver Inventario General</button>
                        <button onclick="formAgregarProducto()" class="bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-xl font-bold shadow">➕ Agregar Producto Nuevo</button>
                        <button onclick="verHistorialVentas()" class="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold shadow">📋 Historial de Ventas</button>
                        <button onclick="verEstadisticas()" class="bg-amber-600 hover:bg-amber-700 text-white p-4 rounded-xl font-bold shadow">📊 Estadísticas del Sistema</button>
                    </div>
                </div>
            `;
        }

        function verInventarioAdmin() {
            let html = `<div class="bg-white/95 backdrop-blur-md w-full max-w-4xl p-6 rounded-2xl shadow-2xl max-h-[85vh] flex flex-col"><h2 class="text-2xl font-black text-slate-800 mb-4">📦 Inventario General</h2><div class="overflow-y-auto flex-grow mb-4"><table class="w-full text-left border-collapse"><thead><tr class="border-b bg-slate-100"><th class="p-3">Código</th><th class="p-3">Nombre</th><th class="p-3">Precio</th><th class="p-3">Stock</th><th class="p-3">Acción</th></tr></thead><tbody>`;
            productos.forEach(p => {
                html += `<tr class="border-b"><td class="p-3">${p.codigo}</td><td class="p-3 font-semibold">${p.nombre}</td><td class="p-3">Q${p.precio.toFixed(2)}</td><td class="p-3">${p.stock}</td><td class="p-3"><button onclick="eliminarProducto('${p.codigo}')" class="text-red-500 font-bold hover:underline">Eliminar</button></td></tr>`;
            });
            html += `</tbody></table></div><button onclick="mostrarMenuAdmin()" class="bg-slate-800 text-white py-2 px-4 rounded-xl font-bold">Volver al Menú</button></div>`;
            document.getElementById('app').innerHTML = html;
        }

        function eliminarProducto(codigo) {
            productos = productos.filter(p => p.codigo !== codigo);
            alert("Producto eliminado.");
            verInventarioAdmin();
        }

        function formAgregarProducto() {
            document.getElementById('app').innerHTML = `
                <div class="bg-white/95 backdrop-blur-md w-full max-w-md p-6 rounded-2xl shadow-2xl">
                    <h2 class="text-2xl font-bold text-slate-800 mb-4">➕ Agregar Producto</h2>
                    <input type="text" id="pCod" placeholder="Código (ej. F004)" class="w-full p-2 border rounded-xl mb-3">
                    <input type="text" id="pNom" placeholder="Nombre" class="w-full p-2 border rounded-xl mb-3">
                    <input type="text" id="pDep" placeholder="Deporte (Fútbol / Básquetbol)" class="w-full p-2 border rounded-xl mb-3">
                    <input type="text" id="pCat" placeholder="Categoría (Calzado, Balones...)" class="w-full p-2 border rounded-xl mb-3">
                    <input type="number" id="pPre" placeholder="Precio en Q" class="w-full p-2 border rounded-xl mb-3">
                    <input type="number" id="pStk" placeholder="Stock inicial" class="w-full p-2 border rounded-xl mb-3">
                    <input type="text" id="pImg" placeholder="URL de la imagen" class="w-full p-2 border rounded-xl mb-4">
                    <button onclick="guardarNuevoProducto()" class="w-full bg-teal-600 text-white font-bold py-2 rounded-xl mb-2">Guardar</button>
                    <button onclick="mostrarMenuAdmin()" class="w-full bg-gray-300 text-slate-800 font-bold py-2 rounded-xl">Volver</button>
                </div>
            `;
        }

        function guardarNuevoProducto() {
            let codigo = document.getElementById('pCod').value.trim().toUpperCase();
            let nombre = document.getElementById('pNom').value.trim();
            let deporte = document.getElementById('pDep').value.trim();
            let categoria = document.getElementById('pCat').value.trim();
            let precio = parseFloat(document.getElementById('pPre').value);
            let stock = parseInt(document.getElementById('pStk').value);
            let imagen = document.getElementById('pImg').value.trim() || "https://images.unsplash.com/photo-1511886929837-354d827aae26?w=300";
            if (!codigo || !nombre || isNaN(precio) || isNaN(stock)) { alert("Por favor completa los campos correctamente."); return; }
            productos.push({ codigo, nombre, deporte, categoria, precio, stock, imagen });
            alert("¡Producto agregado exitosamente!");
            mostrarMenuAdmin();
        }

        function verHistorialVentas() {
            let html = `<div class="bg-white/95 backdrop-blur-md w-full max-w-3xl p-6 rounded-2xl shadow-2xl max-h-[85vh] flex flex-col"><h2 class="text-2xl font-black text-slate-800 mb-4">📋 Historial de Ventas</h2>`;
            if (ventas.length === 0) {
                html += `<p class="text-slate-500 my-8 text-center">No hay ventas registradas.</p>`;
            } else {
                html += `<div class="overflow-y-auto flex-grow mb-4"><table class="w-full text-left"><tr class="border-b bg-slate-100"><th class="p-2">Código</th><th class="p-2">Producto</th><th class="p-2">Cantidad</th><th class="p-2">Total</th></tr>`;
                ventas.forEach(v => { html += `<tr class="border-b"><td class="p-2">${v.codigo}</td><td class="p-2">${v.nombre}</td><td class="p-2">${v.cantidad}</td><td class="p-2 font-bold text-teal-600">Q${v.total.toFixed(2)}</td></tr>`; });
                html += `</table></div>`;
            }
            html += `<button onclick="mostrarMenuAdmin()" class="bg-slate-800 text-white py-2 px-4 rounded-xl font-bold">Volver</button></div>`;
            document.getElementById('app').innerHTML = html;
        }

        function verEstadisticas() {
            let ingresosTotal = ventas.reduce((sum, v) => sum + v.total, 0);
            let unidadesTotal = ventas.reduce((sum, v) => sum + v.cantidad, 0);
            document.getElementById('app').innerHTML = `
                <div class="bg-white/95 backdrop-blur-md w-full max-w-md p-6 rounded-2xl shadow-2xl">
                    <h2 class="text-2xl font-black text-slate-800 mb-4">📊 Estadísticas</h2>
                    <p class="text-slate-700 mb-2">• Productos en catálogo: <strong>${productos.length}</strong></p>
                    <p class="text-slate-700 mb-2">• Transacciones realizadas: <strong>${ventas.length}</strong></p>
                    <p class="text-slate-700 mb-2">• Unidades vendidas: <strong>${unidadesTotal}</strong></p>
                    <p class="text-slate-700 mb-6 text-lg font-bold text-teal-600">• Ingresos Totales: Q${ingresosTotal.toFixed(2)}</p>
                    <button onclick="mostrarMenuAdmin()" class="w-full bg-slate-800 text-white font-bold py-2 rounded-xl">Volver</button>
                </div>
            `;
        }

        // Iniciar aplicación
        mostrarInicio();
    </script>
</body>
</html>
